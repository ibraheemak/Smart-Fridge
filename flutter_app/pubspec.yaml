name: smart_fridge
description: Smart Fridge mobile app — Group #8, Technion ICST
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_auth: ^5.1.0
  firebase_database: ^11.1.0

  # Networking & images
  http: ^1.2.1
  cached_network_image: ^3.3.2
  image: ^4.2.0            # resize + baseline-JPEG re-encode for fridge icons

  # Charts
  fl_chart: ^0.68.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utilities
  shared_preferences: ^2.3.0
  share_plus: ^10.0.0

  # Local notifications (expiry / temperature / door alerts)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
